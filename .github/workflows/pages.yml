# The showcase: Regal's own site (the viewer, the row, the playground) as a
# static `nuxt generate`, deployed to GitHub Pages from main. README: "Showcase".
#
# Needs, once (the owner, by hand):
#   - Settings → Pages → Build and deployment → Source: GitHub Actions.
#   - The repository public (or a paid plan): Pages on a private repository
#     needs GitHub Pro/Team, so the first green run comes after the switch.
#
# Base path: a project site lives at https://fabkho.github.io/regal/, so the
# build runs with NUXT_APP_BASE_URL=/regal/ (configure-pages reports the path).
# With a custom domain set in Settings → Pages (e.g. regal.fabkho.dev; no CNAME
# file needed for an Actions deploy) configure-pages reports '' and the build
# goes to the domain root by itself. The variable REGAL_SITE_BASE_URL
# (Settings → Variables), when set, wins over both, e.g. '/'.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push replaces a queued one, a running deploy finishes.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Static: every page prerendered, the demo library files and the
      # bookcase model under the base path. No secrets, and no real data in
      # the build: the owner's shelf (REGAL_SITE_SHELF_SRC) is only named
      # here; the browser loads it and its images from where they are
      # published, whose CORS policy must allow this site's origin.
      # Repository variables override both; an empty REGAL_SITE_SHELF_SRC
      # variable can't switch it off, so delete the line for the demo.
      - name: Generate
        run: pnpm generate
        env:
          NUXT_APP_BASE_URL: ${{ vars.REGAL_SITE_BASE_URL || format('{0}/', steps.pages.outputs.base_path) }}
          REGAL_SITE_SHELF_SRC: ${{ vars.REGAL_SITE_SHELF_SRC || 'https://books.fabkho.dev/v2/library.json' }}
          REGAL_SITE_SHELF_NAME: ${{ vars.REGAL_SITE_SHELF_NAME || 'Fabian''s shelf' }}

      - name: Upload
        uses: actions/upload-pages-artifact@v5
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
